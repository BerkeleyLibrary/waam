---

services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    restart: always
    ports:
      - 3002:3002
    secrets:
      - DATABASE_URL

  db:
    image: mariadb:10
    restart: always
    environment:
      - MYSQL_DATABASE=amms2
      - MYSQL_PASSWORD=amms2
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_USER=amms2
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mariadb --protocol=TCP --host=127.0.0.1
          --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD"
          --database="$$MYSQL_DATABASE" --execute="SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - db-volume:/var/lib/mysql
      - ./data/test-data.sql:/docker-entrypoint-initdb.d/test-data.sql

networks:
  default:
    driver: bridge

secrets:
  DATABASE_URL:
    file: secrets/DATABASE_URL

volumes:
  db-volume:
